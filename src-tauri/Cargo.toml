[package]
name = "dino-overlay"
version = "1.2.2"
description = "Chrome dino transparent always-on-top overlay (Tauri path-3, ~MB scale)"
authors = ["QwenWork"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dino_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Tauri uses a custom protocol for prod asset serving; enabled by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

# Size-optimized release profile for the ~3-5 MB target.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
